# Base44 sandbox compose for the "Windows 10 in Docker" project.
#
# The project's own docker-compose.yml targets a GitHub Codespace with nested
# virtualization (4 cores / 16 GB / /dev/kvm). This sandbox has no /dev/kvm and
# ~7 GB RAM, so the values below are adapted for it:
#   - KVM=N        software emulation (about 10x slower); the sandbox exposes no /dev/kvm
#   - RAM_SIZE=4G  hard ceiling: the host has 4 cores / ~7 GB RAM in total
#   - CPU_CORES=4  every core the host has
#   - DISK_SIZE=32G the sparse disk image has to fit in the ~29 GB free on the sandbox
#   - ports 3000:8006 so the web console is the preview entry point
services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "10"
      RAM_SIZE: "4G"
      CPU_CORES: "4"
      DISK_SIZE: "32G"
      USERNAME: "admin"
      PASSWORD: "MatKhau123"
      KVM: "N"
      # Intel HDA sound card for the guest; audio is streamed to the web console
      AUDIO: "Y"
      # TCG tuning (no /dev/kvm here, so these are the available levers):
      #  - tb-size=384: bigger translation-block cache than the 32 MB default, so
      #    guest code is translated once instead of repeatedly.
      #  - CPU_FLAGS: AVX/AVX-512 are the slowest instruction groups to emulate in
      #    software and Windows never requires them; hiding them keeps the guest
      #    on SSE2/SSE4 paths.
      ARGUMENTS: "-accel tcg,tb-size=384"
      CPU_FLAGS: "-avx,-avx2,-avx512f,-avx512vl"
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "3000:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - windows-data:/storage
      # Client-side console tuning: auto-connect + auto-reconnect, scaled view and
      # a cheap JPEG setting so a CPU-starved QEMU spends less time encoding frames.
      - ./novnc-defaults.json:/usr/share/novnc/defaults.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8006/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    # Windows shutting down exits the container with code 0, which took the
    # console (port 3000) offline and left the preview on a black screen.
    # `unless-stopped` brings QEMU back up from the persisted disk instead.
    restart: unless-stopped
    stop_grace_period: 2m
    labels:
      base44.project: "Windows 10"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  windows-data:
